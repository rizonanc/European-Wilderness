# Terrain Diffusion MC configuration

# Inference device: "cpu", "gpu", or "auto" (try GPU first then fall back to CPU).
# Ignored for the CPU build.
inference.device=gpu

# Use the lazy GPU session cache below. False eagerly retains all model sessions
# and bypasses its memory fallback; keep true for the adaptive lifetime policy.
inference.offload_models=true

# Cached GPU sessions (1..3), loaded on first use. 3 avoids rebuilding coarse/base/
# decoder sessions between tiles, but uses more VRAM. 1 restores legacy offloading.
# A recognized DirectML/CUDA memory failure retries once with a single session,
# then keeps that limit until the pipeline closes. CoreML always uses one slot.
# This is a session count, not a byte/VRAM limit; restart after changing it.
inference.gpu_session_cache=3

# Validate SHA-256 for pre-existing files in .minecraft/terrain-diffusion-models.
# Set to false to allow custom user-provided models/config without hash checks.
validate_model=true

# Port for the local terrain explorer web UI (started with /td-explore command).
explorer.port=19801

# Terrain generation region side length in blocks. Must be a power of 2.
# Examples: 128, 256, 512, 1024.
# Use larger values to generate in larger batches (more chunks per second)
# Use smaller values to generate in smaller batches (most responsive)
tile_size=256

# Spawn search: coarse-pixel region sizes for land detection near (0,0).
# Starts at initial_size x initial_size, expands by 8 each iteration up to max_size x max_size.
spawn_search.initial_size=16
spawn_search.max_size=128

# Preparation mode: "on_demand" (default) generates tiles as the player explores;
# "prepared_only" never runs inference on the chunk path and serves a flat fallback
# plain outside the prepared area instead of stalling chunk generation.
preparation.mode=on_demand

# Disk quota for prepared tiles, in MB (1024..1048576).
performance.disk_quota_mb=10240

# Optional ahead-of-player terrain preparation: off | adaptive.
# Adaptive prepares up to four predicted tiles, one at a time, only with server tick
# headroom. Leave off until cold-flight frame-time comparison proves a benefit.
# Requires restarting the game after a change; does not alter world geography.
performance.prefetch=off

# Automatic-world water preparation: off | adaptive. Includes raw terrain,
# catchments and finished banks. One finite stage at a time, with idle gaps;
# current generation has priority between stages. Does not place Minecraft chunks.
# Works independently of the legacy raw-only performance.prefetch switch.
# Disable if GPU generation interferes with rendering on your hardware.
performance.water_prefetch=adaptive

# Phase 4 experimental bounded write-behind for frozen water plan persistence (default off).
# Moves the GZIP+disk write of newly computed water tiles/units off the requesting thread
# onto a single bounded writer. Plans stay atomic, write-once and regenerable; when the
# bounded queue is full the caller writes synchronously as before. Nothing else changes.
performance.water_write_behind=false

# Optional Voxy 0.2.16-beta bridge, integrated singleplayer/LAN host only.
# Default source: real Minecraft/Chunky chunks and Voxy's native ingest.
# /td-voxy chunky <radius-in-chunks> explicitly starts Chunky pre-generation (1..2048).
# /td-voxy start never silently starts real chunk pre-generation.
# Optional prepared source retains the old bounded exporter for unseen/unsaved columns.
compat.voxy.enabled=true
compat.voxy.radius_blocks=1024
# auto follows Voxy's render horizon (or WorldGen in exact-only mode).
# manual uses radius_blocks after restart. /td-voxy start still overrides at runtime.
compat.voxy.radius_mode=auto
compat.voxy.prepare_ahead=true
# Use actual tree geometry in the optional prepared exporter.
compat.voxy.trees=true
# chunks: real chunks from Minecraft/Chunky and native Voxy ingest (default).
# prepared: optional legacy prepared-data TD exporter. Experimental coarse is retired.
# Existing compat.voxy.coarse=true is ignored. No real chunks are generated automatically.
compat.voxy.source=chunks
# Cap for the optional prepared exporter; native Voxy/Chunky distance is independent.
compat.voxy.detail_radius_blocks=2048
# Phase 4.5 experimental renderer-only neural horizon (Native Neural LOD) for Voxy
# 0.2.16-beta. Default off. Works with both sources: real chunks stay authoritative via
# native ingest, prepared source keeps its legacy exporter. Renders temporary sections
# only; nothing is inserted into Voxy storage or saved.
compat.voxy.coarse_experimental=false
# Coordinate VoxyWorldGen 2.2.4: pause its duplicate pregen in TD overworlds.
# Native real chunk mode leaves chunk broadcasts intact for Voxy ingestion.
compat.voxy_worldgen.enabled=true

# Provide Terrain Diffusion heights and water depths to Road Weaver 2.2.0-1.21.11.
# This switch is read when Minecraft starts.
compat.roadweaver.enabled=true
# River behavior and newly planned water
rivers.current=true
rivers.boats=true
rivers.items=true
rivers.strength=100
rivers.width_variation=100
rivers.depth_variation=100
rivers.lake_threshold=100
# Allow channels above the foothills in new Terrain Diffusion worlds.
rivers.mountain_rivers=false

# Optional decorations and European tree density
nature.geophilic=true
nature.geophilic_frequency=100
nature.wilder_wild=true
nature.wilder_wild_frequency=100
nature.tree_density=100

# Alex's Mobs biome spawn weights
animals.alex_weight=100
animals.alex_land=true
animals.alex_aquatic=true
animals.alex_hostile=true

# Terrain preferences saved on creation of a new world
terrain.mountain_relief=100
terrain.biome_variety=0

# Biome balance for new worlds (0-200, 100 keeps the normal distribution).
terrain.mountain_amount=100
terrain.ocean_amount=100
terrain.desert_amount=100
terrain.forest_amount=100
terrain.field_amount=100

# Climate of newly created Terrain Diffusion worlds.
terrain.climate=temperate
